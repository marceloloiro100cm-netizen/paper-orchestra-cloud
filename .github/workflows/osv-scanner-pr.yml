# M15: OSV-Scanner em cada PR; falha só se o PR introduzir vulnerabilidade nova.
# Origem: R28/R40 em docs/upstreams.json. Exemplo oficial conferido em 24/11/2026:
# https://google.github.io/osv-scanner/github-action
name: CI · OSV-Scanner no PR

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]

permissions:
  # Necessário para enviar o SARIF ao CodeQL.
  actions: read
  # Necessário para publicar na aba Security.
  security-events: write
  contents: read

jobs:
  scan-pr:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.7.1"
