name: Endereço antigo redireciona para scriptoriummpie.web.app

# Desde 24/11/2026 o endereço oficial é https://scriptoriummpie.web.app/ (decisão do
# responsável). O site padrão do projeto (paperorchestra-mestrado.web.app) deixa de
# receber a aplicação: fica só com um redirecionamento permanente (301) para o novo
# endereço, para favoritos e links antigos. O site novo é publicado por
# deploy-scriptorium-alias.yml.
#
# O login Google não é afetado: o Firebase Hosting atende /__/auth/* antes de
# qualquer redirecionamento (namespace reservado), e o authDomain continua
# paperorchestra-mestrado.firebaseapp.com.
on:
  push:
    branches: [main]
    paths:
      - hosting-redirect/**
      - .github/workflows/deploy-hosting.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: paper-orchestra-hosting
  cancel-in-progress: false

jobs:
  redirecionar:
    name: Publicar só o redirecionamento no endereço antigo
    if: github.repository == 'marceloloiro100cm-netizen/paper-orchestra-cloud' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Conferir configuração do redirecionamento
        run: |
          python3 - <<'PY'
          import json
          cfg = json.load(open("hosting-redirect/firebase.json"))["hosting"]
          assert "site" not in cfg, "Este workflow publica só no site padrão (endereço antigo)."
          assert cfg["redirects"][0]["destination"] == "https://scriptoriummpie.web.app/"
          assert "rewrites" not in cfg
          print("Redirecionamento conferido.")
          PY

      - name: Autenticar no Google Cloud (OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/201655574048/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: paper-orchestra-deployer@paperorchestra-mestrado.iam.gserviceaccount.com
          project_id: paperorchestra-mestrado
          create_credentials_file: true
          export_environment_variables: true

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Publicar o redirecionamento no site padrão
        working-directory: hosting-redirect
        run: firebase deploy --only hosting --project paperorchestra-mestrado --non-interactive

      - name: Confirmar o redirecionamento
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            location="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "https://paperorchestra-mestrado.web.app/?r=${GITHUB_SHA}" || true)"
            echo "Tentativa ${attempt}: ${location}"
            if [[ "$location" == "301 https://scriptoriummpie.web.app/" ]]; then
              echo "Endereço antigo redireciona para o oficial."
              exit 0
            fi
            sleep 5
          done
          echo "O redirecionamento não foi confirmado." >&2
          exit 1
