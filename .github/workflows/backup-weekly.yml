name: Backup semanal da biblioteca

on:
  schedule:
    - cron: "15 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: paper-orchestra-storage-backup
  cancel-in-progress: false

jobs:
  copiar:
    name: Copiar arquivos sem remover originais
    if: github.repository == 'marceloloiro100cm-netizen/paper-orchestra-cloud' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Autenticar usando OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/201655574048/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: paper-orchestra-deployer@paperorchestra-mestrado.iam.gserviceaccount.com
          project_id: paperorchestra-mestrado
          create_credentials_file: true
          export_environment_variables: true
      - name: Preparar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: paperorchestra-mestrado
      - name: Sincronizar somente o projeto PaperOrchestra
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="gs://paperorchestra-mestrado-paper-storage"
          DEST="gs://paperorchestra-mestrado-paper-backups"
          # Só espelha exclusões quando o bucket de backup tem versionamento
          # e a regra de 90 dias (workflow "Backup — diagnóstico e configuração").
          # Assim, o que foi apagado no site vira versão antiga, recuperável por
          # 90 dias, e depois some. Sem versionamento, nada é removido do destino.
          VERSIONING="$(gcloud storage buckets describe "$DEST" --format='value(versioning_enabled)' 2>/dev/null || true)"
          if [ "${VERSIONING,,}" = "true" ]; then
            gcloud storage rsync --recursive --delete-unmatched-destination-objects "$SOURCE" "$DEST"
            echo "Backup concluído; exclusões espelhadas como versões antigas (90 dias)."
          else
            gcloud storage rsync --recursive "$SOURCE" "$DEST"
            echo "Backup incremental concluído; originais mantidos (versionamento desligado)."
          fi
