# Bootstrap BYOK sem Cloud Shell (pendência da issue #43).
#
# Modo "diagnosticar" (padrão): SOMENTE LEITURA. Mostra as permissões efetivas
# do deployer e o estado das concessões BYOK. Não altera nada.
#
# Modo "aplicar": roda scripts/setup-byok-iam.sh pelo GitHub Actions. Exige o
# texto de confirmação CONFIRMO-BYOK. Se o deployer não puder criar papéis
# personalizados, mas puder alterar a política IAM do projeto, ele recebe
# Role Administrator TEMPORÁRIO com condição de expiração de 30 minutos
# (request.time), usa só para criar os dois papéis do BYOK e remove a
# concessão no fim, mesmo em caso de falha. A expiração é uma segunda barreira:
# se a remoção falhar, a concessão deixa de valer sozinha.
#
# Modo "permissoes-deploy": dá ao deployer só o que o gcloud builds submit
# precisa (Service Usage Consumer e Storage Admin restrito ao bucket de fontes
# do Cloud Build) e Artifact Registry Reader. Exige Project IAM Admin temporário concedido no Console e
# remove esse papel ao final.
name: Bootstrap BYOK (sem Cloud Shell)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "diagnosticar (só leitura) ou aplicar"
        required: true
        default: diagnosticar
        type: choice
        options: [diagnosticar, aplicar, permissoes-deploy]
      confirmacao:
        description: "Para aplicar ou permissoes-deploy, digite CONFIRMO-BYOK"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

concurrency:
  group: paper-orchestra-iam
  cancel-in-progress: false

env:
  PROJECT_ID: paperorchestra-mestrado
  DEPLOYER: paper-orchestra-deployer@paperorchestra-mestrado.iam.gserviceaccount.com
  TEMP_TITLE: TemporarioBootstrapBYOK

jobs:
  bootstrap:
    if: github.repository == 'marceloloiro100cm-netizen/paper-orchestra-cloud' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Autenticar no Google Cloud por OIDC (sem chave JSON)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/201655574048/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: paper-orchestra-deployer@paperorchestra-mestrado.iam.gserviceaccount.com
          project_id: paperorchestra-mestrado
          create_credentials_file: true
          export_environment_variables: true

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: paperorchestra-mestrado

      - name: Diagnóstico (somente leitura)
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${PROJECT_ID}:testIamPermissions" \
            -d '{"permissions":["resourcemanager.projects.getIamPolicy","resourcemanager.projects.setIamPolicy","iam.roles.create","iam.roles.update","iam.roles.get","serviceusage.services.enable","serviceusage.services.use","cloudbuild.builds.create","storage.buckets.create","storage.buckets.get","storage.objects.create","artifactregistry.repositories.uploadArtifacts","iam.serviceAccounts.actAs"]}' \
            > /tmp/perms.json
          python3 - <<'PY'
          import json
          held = set(json.load(open('/tmp/perms.json')).get('permissions', []))
          for p in ["resourcemanager.projects.getIamPolicy", "resourcemanager.projects.setIamPolicy",
                    "iam.roles.create", "iam.roles.update", "iam.roles.get", "serviceusage.services.enable",
                    "serviceusage.services.use", "cloudbuild.builds.create", "storage.buckets.create",
                    "storage.buckets.get", "storage.objects.create",
                    "artifactregistry.repositories.uploadArtifacts", "iam.serviceAccounts.actAs"]:
              print(("SIM " if p in held else "NÃO"), p)
          PY
          for role in scriptoriumByokWriter scriptoriumByokAuditor; do
            if gcloud iam roles describe "$role" --project="$PROJECT_ID" >/dev/null 2>&1; then
              echo "Papel $role: existe"
            else
              echo "Papel $role: ausente (ou sem permissão para ler)"
            fi
          done
          gcloud projects get-iam-policy "$PROJECT_ID" --format=json > /tmp/policy.json
          python3 - <<'PY'
          import json, os
          policy = json.load(open('/tmp/policy.json'))
          me = "serviceAccount:" + os.environ["DEPLOYER"]
          roles = sorted({(b["role"], (b.get("condition") or {}).get("title", "")) for b in policy.get("bindings", [])
                          if me in b.get("members", [])})
          print("Papéis do deployer no projeto:")
          for role, cond in roles:
              print("  -", role, f"(condição: {cond})" if cond else "")
          PY
          bash scripts/audit-byok-iam.sh || echo "Auditoria BYOK ainda incompleta (esperado antes do bootstrap)."
          # Bucket de fontes do Cloud Build (usado por gcloud builds submit no deploy).
          BUCKET="${PROJECT_ID}_cloudbuild"
          code="$(curl -sS -o /tmp/bucket.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
            "https://storage.googleapis.com/storage/v1/b/${BUCKET}")"
          echo "Bucket ${BUCKET}: HTTP ${code}"
          python3 -c "import json; d=json.load(open('/tmp/bucket.json')); print('  projeto:', d.get('projectNumber'), 'local:', d.get('location'), 'erro:', (d.get('error') or {}).get('message'))" || true
          curl -sS -H "Authorization: Bearer $TOKEN" \
            "https://storage.googleapis.com/storage/v1/b/${BUCKET}/iam/testPermissions?permissions=storage.objects.create&permissions=storage.objects.get&permissions=storage.objects.list&permissions=storage.buckets.get" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('  permissões no bucket:', d.get('permissions'), (d.get('error') or {}).get('message',''))" || true
          echo "Número do projeto: $(gcloud projects describe "$PROJECT_ID" --format='value(projectNumber)')"
          for sa in paper-orchestra-api paper-orchestra-worker; do
            email="${sa}@${PROJECT_ID}.iam.gserviceaccount.com"
            curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "https://iam.googleapis.com/v1/projects/${PROJECT_ID}/serviceAccounts/${email}:testIamPermissions" \
              -d '{"permissions":["iam.serviceAccounts.actAs","iam.serviceAccounts.getIamPolicy"]}' \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print('  ${sa}:', d.get('permissions'), (d.get('error') or {}).get('message',''))" || true
          done

      - name: Conta de serviço usada pelo Cloud Build (somente leitura)
        if: inputs.modo == 'diagnosticar'
        shell: bash
        run: |
          set -uo pipefail
          echo "Conta padrão do Cloud Build: $(gcloud builds get-default-service-account --project="$PROJECT_ID" --format='value(serviceAccountEmail)' 2>&1 | tail -1)"
          gcloud iam service-accounts list --project="$PROJECT_ID" --format='value(email,uniqueId,disabled)' 2>&1 | sed 's/^/  conta: /'
          TOKEN="$(gcloud auth print-access-token)"
          for email in $(gcloud iam service-accounts list --project="$PROJECT_ID" --format='value(email)' 2>/dev/null); do
            r="$(curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "https://iam.googleapis.com/v1/projects/${PROJECT_ID}/serviceAccounts/${email}:testIamPermissions" \
              -d '{"permissions":["iam.serviceAccounts.actAs"]}')"
            echo "  actAs em ${email}: $(echo "$r" | grep -q actAs && echo SIM || echo NÃO)"
          done

      - name: Conferir confirmação
        if: inputs.modo != 'diagnosticar'
        shell: bash
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          if [ "$CONFIRMACAO" != "CONFIRMO-BYOK" ]; then
            echo "::error::Para aplicar, rode de novo com confirmacao=CONFIRMO-BYOK."
            exit 1
          fi

      - name: Papel temporário de criação de papéis (30 min), se necessário
        if: inputs.modo == 'aplicar'
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          held="$(curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            "https://cloudresourcemanager.googleapis.com/v1/projects/${PROJECT_ID}:testIamPermissions" \
            -d '{"permissions":["iam.roles.create","iam.roles.update","resourcemanager.projects.setIamPolicy"]}')"
          if echo "$held" | grep -q '"iam.roles.create"' && echo "$held" | grep -q '"iam.roles.update"'; then
            echo "O deployer já pode criar papéis; nenhuma concessão temporária necessária."
            echo "TEMP_GRANTED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          if ! echo "$held" | grep -q '"resourcemanager.projects.setIamPolicy"'; then
            echo "::error::O deployer não pode alterar o IAM do projeto. Conceda pelo Console (celular serve), por 1 hora, Role Administrator e Project IAM Admin ao deployer e rode de novo. Este workflow remove os dois ao final."
            exit 1
          fi
          EXPIRES="$(date -u -d '+30 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          EXPR="request.time < timestamp(\"${EXPIRES}\")"
          echo "TEMP_EXPR=${EXPR}" >> "$GITHUB_ENV"
          echo "TEMP_GRANTED=true" >> "$GITHUB_ENV"
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${DEPLOYER}" --role="roles/iam.roleAdmin" \
            --condition="title=${TEMP_TITLE},description=Bootstrap BYOK; expira em ${EXPIRES},expression=${EXPR}" \
            --quiet >/dev/null
          echo "Role Administrator temporário concedido até ${EXPIRES}."

      - name: Aplicar bootstrap BYOK (scripts/setup-byok-iam.sh)
        if: inputs.modo == 'aplicar'
        shell: bash
        run: |
          set -uo pipefail
          # O IAM pode levar alguns minutos para propagar a concessão temporária.
          # O script é idempotente (describe -> create/update; bindings repetidos
          # não duplicam), então pode ser repetido com segurança.
          for attempt in 1 2 3 4 5 6; do
            if PROJECT_ID="$PROJECT_ID" bash scripts/setup-byok-iam.sh; then
              echo "Bootstrap aplicado na tentativa ${attempt}."
              exit 0
            fi
            echo "Tentativa ${attempt} falhou; aguardando 60 s pela propagação do IAM..."
            sleep 60
          done
          echo "::error::O bootstrap não pôde ser aplicado. Veja as mensagens acima."
          exit 1

      - name: Permissões de build do deployer (Service Usage Consumer e bucket do Cloud Build)
        if: inputs.modo == 'permissoes-deploy'
        shell: bash
        run: |
          set -euo pipefail
          BUCKET="${PROJECT_ID}_cloudbuild"
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${DEPLOYER}" --role="roles/serviceusage.serviceUsageConsumer" \
            --condition=None --quiet >/dev/null
          echo "Concedido: roles/serviceusage.serviceUsageConsumer"
          # Cloud Run confere se quem publica pode ler a imagem no Artifact Registry.
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${DEPLOYER}" --role="roles/artifactregistry.reader" \
            --condition=None --quiet >/dev/null
          echo "Concedido: roles/artifactregistry.reader"
          # Storage Admin só vale no bucket de fontes do Cloud Build (e no nível de
          # projeto, onde o gcloud lista buckets para conferir o dono). Os buckets
          # de dados dos pesquisadores ficam de fora da condição.
          EXPR="resource.type == \"cloudresourcemanager.googleapis.com/Project\" || resource.name.startsWith(\"projects/_/buckets/${BUCKET}\")"
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:${DEPLOYER}" --role="roles/storage.admin" \
            --condition="title=DeployerFontesCloudBuild,description=Somente o bucket ${BUCKET},expression=${EXPR}" \
            --quiet >/dev/null
          echo "Concedido: roles/storage.admin restrito a ${BUCKET}"
          for attempt in 1 2 3 4 5 6 7 8; do
            TOKEN="$(gcloud auth print-access-token)"
            p="$(curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "https://cloudresourcemanager.googleapis.com/v1/projects/${PROJECT_ID}:testIamPermissions" \
              -d '{"permissions":["serviceusage.services.use"]}')"
            b="$(curl -sS -H "Authorization: Bearer $TOKEN" \
              "https://storage.googleapis.com/storage/v1/b/${BUCKET}/iam/testPermissions?permissions=storage.objects.create&permissions=storage.buckets.get")"
            echo "Tentativa ${attempt}: projeto=${p//[$'\n ']/} bucket=${b//[$'\n ']/}"
            if echo "$p" | grep -q services.use && echo "$b" | grep -q objects.create && echo "$b" | grep -q buckets.get; then
              echo "Permissões de build propagadas."
              exit 0
            fi
            sleep 30
          done
          echo "::warning::As concessões foram feitas, mas ainda não propagaram. Rode o deploy em alguns minutos."

      - name: Remover papéis temporários (sempre)
        if: always() && inputs.modo != 'diagnosticar'
        shell: bash
        run: |
          set -euo pipefail
          # Remove do deployer os papéis de bootstrap, venham eles da concessão
          # automática (TemporarioBootstrapBYOK) ou de uma concessão manual feita
          # no Console. --all remove qualquer condição. Project IAM Admin sai por
          # último, porque é ele que autoriza a própria remoção. iam.admin e
          # accessapproval.admin entram na lista porque já foram concedidos por
          # engano no Console durante um bootstrap (nomes parecidos no seletor).
          TOKEN="$(gcloud auth print-access-token)"
          if ! curl -sS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              "https://cloudresourcemanager.googleapis.com/v1/projects/${PROJECT_ID}:testIamPermissions" \
              -d '{"permissions":["resourcemanager.projects.setIamPolicy"]}' | grep -q setIamPolicy; then
            echo "::warning::O deployer não pode alterar o IAM; papéis extras concedidos no Console precisam ser removidos lá."
          fi
          gcloud projects get-iam-policy "$PROJECT_ID" --format=json > /tmp/before.json
          for role in roles/iam.roleAdmin roles/iam.admin roles/accessapproval.admin roles/resourcemanager.projectIamAdmin; do
            if python3 -c "import json,os,sys; p=json.load(open('/tmp/before.json')); me='serviceAccount:'+os.environ['DEPLOYER']; sys.exit(0 if any(b.get('role')=='$role' and me in b.get('members',[]) for b in p.get('bindings',[])) else 1)"; then
              if gcloud projects remove-iam-policy-binding "$PROJECT_ID" \
                  --member="serviceAccount:${DEPLOYER}" --role="$role" --all --quiet >/dev/null; then
                echo "Removido do deployer: $role"
              else
                echo "::warning::Não foi possível remover $role do deployer; remova pelo Console."
              fi
            fi
          done
          gcloud projects get-iam-policy "$PROJECT_ID" --format=json > /tmp/after.json
          python3 - <<'PY'
          import json, os
          policy = json.load(open('/tmp/after.json'))
          me = "serviceAccount:" + os.environ["DEPLOYER"]
          bad = {"roles/iam.roleAdmin", "roles/iam.admin", "roles/accessapproval.admin", "roles/resourcemanager.projectIamAdmin"}
          left = [b["role"] for b in policy.get("bindings", []) if b.get("role") in bad and me in b.get("members", [])]
          assert not left, f"Papéis de bootstrap ainda aparecem para o deployer: {left}"
          print("Confirmado: o deployer não tem mais nenhum papel administrativo de bootstrap.")
          PY

      - name: Auditoria final
        if: inputs.modo == 'aplicar'
        shell: bash
        run: bash scripts/audit-byok-iam.sh
