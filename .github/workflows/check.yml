name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python files
        run: |
          python -m compileall -q api/main.py worker/runner.py worker/agent_progress.py worker/scientific_audit.py
          python -m unittest discover -s tests -v
      - name: Validate JSON and JS
        run: |
          python -m json.tool firebase.json >/dev/null
          node --check public/app.js
          node --check public/config.js
      - name: Check script syntax
        run: bash -n scripts/deploy-cloud-shell.sh
      - name: Validate public Firebase config and no private credentials
        run: |
          test -f public/config.js
          grep -q 'projectId: "paperorchestra-mestrado"' public/config.js
          ! grep -q 'SUBSTITUIR' public/config.js
          test ! -f .env
          test ! -f secrets.json
