name: Publicar PaperOrchestra (manual)

on:
  workflow_dispatch:
    inputs:
      email_autorizado:
        description: "E-mail da conta Google que poderá entrar no PaperOrchestra"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: paper-orchestra-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Instalar no Firebase e Cloud Run
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    steps:
      - name: Obter o código
        uses: actions/checkout@v4

      - name: Verificar o projeto e o branch de origem
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          test "$REPO" = "marceloloiro100cm-netizen/paper-orchestra-cloud"
          test "$REF" = "refs/heads/main"
          test -f public/config.js
          grep -q 'projectId: "paperorchestra-mestrado"' public/config.js
          bash -n scripts/deploy-cloud-shell.sh
          python -m compileall -q api/main.py worker/runner.py

      - name: Autenticar Google Cloud sem chaves privadas
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/201655574048/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: paper-orchestra-deployer@paperorchestra-mestrado.iam.gserviceaccount.com
          project_id: paperorchestra-mestrado
          create_credentials_file: true
          export_environment_variables: true

      - name: Instalar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: paperorchestra-mestrado

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Instalar Firebase CLI
        run: npm install --global firebase-tools@latest

      - name: Executar implantação
        env:
          PROJECT_ID: paperorchestra-mestrado
          ADMIN_EMAIL: ${{ inputs.email_autorizado }}
          AI_PROVIDER: vertex
          CI: "true"
        run: bash scripts/deploy-cloud-shell.sh
      
      - name: Validar API publicada no Firebase Hosting
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            --output /tmp/paper-health.json \
            https://paperorchestra-mestrado.web.app/api/health
          python -c "import json; data=json.load(open('/tmp/paper-health.json')); assert data.get('ok') is True, data"
          echo "API respondeu corretamente pelo Firebase Hosting."

