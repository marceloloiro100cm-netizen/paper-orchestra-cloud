name: Testar conexão Google Cloud

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  testar-conexao:
    name: Validar identidade GitHub no Google Cloud
    if: github.repository == 'marceloloiro100cm-netizen/paper-orchestra-cloud' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Autenticar por identidade federada (sem chave privada)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/201655574048/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: paper-orchestra-deployer@paperorchestra-mestrado.iam.gserviceaccount.com
          project_id: paperorchestra-mestrado
          create_credentials_file: true
          export_environment_variables: true

      - name: Configurar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: paperorchestra-mestrado

      - name: Verificar acesso sem mostrar token
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth print-access-token >/dev/null
          echo "Conexão GitHub Actions → Google Cloud validada. Nenhuma implantação foi realizada."
