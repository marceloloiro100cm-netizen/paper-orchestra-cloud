name: Manual · Validar acesso ao Gemini Neon

on:
  push:
    branches: [main]
    paths:
      - smoke/neon/**
      - .github/workflows/test-neon-access.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  smoke:
    if: github.repository == 'marceloloiro100cm-netizen/scriptorium' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Autenticar no Google Cloud sem chave (OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/201655574048/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: paper-orchestra-deployer@paperorchestra-mestrado.iam.gserviceaccount.com
          project_id: paperorchestra-mestrado
          create_credentials_file: true
          export_environment_variables: true
      - name: Preparar Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: paperorchestra-mestrado
      - name: Construir ambiente de teste pequeno e isolado
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="southamerica-east1-docker.pkg.dev/paperorchestra-mestrado/paper-orchestra/neon-smoke:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          gcloud builds submit smoke/neon --tag="$IMAGE" --project=paperorchestra-mestrado --timeout=900
      - name: Executar uma chamada curta ao Neon usando a conta do worker
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs deploy paper-orchestra-neon-smoke \
            --image="$IMAGE" --region=southamerica-east1 --project=paperorchestra-mestrado \
            --service-account=paper-orchestra-worker@paperorchestra-mestrado.iam.gserviceaccount.com \
            --memory=512Mi --cpu=1 --max-retries=0 --task-timeout=5m \
            --set-env-vars=GOOGLE_CLOUD_PROJECT=paperorchestra-mestrado --quiet
          gcloud run jobs execute paper-orchestra-neon-smoke \
            --region=southamerica-east1 --project=paperorchestra-mestrado --wait
      - name: Confirmar sucesso do programa no Job
        shell: bash
        run: |
          echo "A execução terminou com código zero e o programa validou a resposta exata NEON_OK."
          echo "A conta do GitHub não precisa de acesso aos logs de artigos privados para isso."
