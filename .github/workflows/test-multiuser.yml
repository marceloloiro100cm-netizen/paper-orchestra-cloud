name: Testar acesso multiusuário e BYOK

on:
  pull_request:
    paths:
      - "api/**"
      - "worker/**"
      - "public/**"
      - "tests/test_access.py"
      - "tests/test_byok.py"
      - "tests/test_credentials.py"
      - "tests/test_multiuser_cross_access.py"
      - "scripts/check-public-onboarding.py"
      - "scripts/check-github-deploys.py"
      - "scripts/deploy-scriptorium-alias.sh"
      - "scripts/authorize-scriptorium-domain.py"
      - ".github/workflows/deploy-scriptorium-alias.yml"
      - "scripts/setup-byok-iam.sh"
      - "scripts/audit-byok-iam.sh"
      - "scripts/bootstrap-cloudshell-unico.sh"
      - ".github/workflows/test-multiuser.yml"
  push:
    branches:
      - feat/scriptorium-multiuser-byok-foundation

permissions:
  contents: read
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Validar sintaxe
        run: |
          python -m compileall -q api/job_state.py api/access.py api/access_requests.py api/model_access.py api/credentials.py api/main.py worker/byok.py worker/runner.py
          python -m py_compile scripts/check-public-onboarding.py tests/test_multiuser_cross_access.py
          node --check public/app.js
          bash -n scripts/setup-byok-iam.sh scripts/audit-byok-iam.sh scripts/bootstrap-cloudshell-unico.sh scripts/deploy-scriptorium-alias.sh
          python -m py_compile scripts/authorize-scriptorium-domain.py
      - name: Instalar dependências mínimas
        run: python -m pip install -q "fastapi>=0.115,<1" "pydantic>=2.5,<3" google-api-core
      - name: Testes de convites e segregação das chaves
        run: |
          python -m unittest discover -s tests -p 'test_access.py' -v
          python -m unittest discover -s tests -p 'test_byok.py' -v
          python -m unittest discover -s tests -p 'test_credentials.py' -v
          python -m unittest discover -s tests -p 'test_model_access.py' -v
          python -m unittest discover -s tests -p 'test_access_requests.py' -v
          python -m unittest discover -s tests -p 'test_multiuser_cross_access.py' -v
          python -m unittest discover -s tests -p 'test_job_state.py' -v
          python -m unittest discover -s tests -p 'test_container_modules.py' -v

      - name: Diagnóstico público da API atual (sem token ou dados reais)
        run: python3 scripts/check-public-onboarding.py --diagnostic

      - name: Verificar estado do deploy Firebase e Cloud Run (somente leitura)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-github-deploys.py
