name: Deploy · API e worker (Cloud Run)

on:
  push:
    branches: [main]
    paths:
      - api/**
      - worker/**
      - formatos/**
      - .github/workflows/deploy-services.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: scriptorium-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Atualizar API e Cloud Run Job sem perder os dados
    if: github.repository == 'marceloloiro100cm-netizen/scriptorium' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Obter código
        uses: actions/checkout@v7

      - name: Testes e validação inicial
        run: |
          python -m pip install -q requests fastapi google-api-core "PyMuPDF>=2.1,<3" "numpy>=1.26,<3" "mcp>=2.3,<3"
          python -m compileall -q api/job_state.py api/access.py api/access_requests.py api/model_access.py api/credentials.py api/main.py worker/byok.py worker/runner.py worker/agent_progress.py worker/scientific_audit.py worker/reference_verification.py api/library.py worker/source_materials.py worker/neon_review.py
          python -m unittest discover -s tests -v

      - name: Autenticar no Google Cloud por OIDC
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/201655574048/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: paper-orchestra-deployer@paperorchestra-mestrado.iam.gserviceaccount.com
          project_id: paperorchestra-mestrado
          create_credentials_file: true
          export_environment_variables: true

      - name: Preparar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: paperorchestra-mestrado

      - name: Auditar IAM BYOK sem alterar permissões
        shell: bash
        env:
          PROJECT_ID: paperorchestra-mestrado
        run: |
          set -euo pipefail
          # Configuração de IAM exige administrador de projeto e deve ser feita
          # uma única vez, fora do GitHub Actions. O publicador só audita.
          if ! bash scripts/audit-byok-iam.sh; then
            echo "::error::A liberação BYOK ainda não foi aprovada no IAM. Execute UMA VEZ, como administrador no Cloud Shell, scripts/setup-byok-iam.sh e scripts/audit-byok-iam.sh. Nunca conceda papel Role Admin ao deployer automático."
            exit 1
          fi

      - name: Construir API e worker sem alterar produção
        shell: bash
        env:
          PROJECT: paperorchestra-mestrado
          REGION: southamerica-east1
        run: |
          set -euo pipefail
          API_IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/paper-orchestra/api:agents-${GITHUB_SHA}"
          WORKER_IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/paper-orchestra/worker:agents-${GITHUB_SHA}"
          # O deployer não é Viewer do projeto, então o gcloud não consegue
          # transmitir os logs do build. Disparamos com --async e acompanhamos o
          # status pela API do Cloud Build (cloudbuild.builds.get).
          build() {
            local dir="$1" image="$2" id status
            id="$(gcloud builds submit "$dir" --tag="$image" --project="$PROJECT" --timeout=1800 \
                    --async --format='value(id)')"
            echo "Build de ${dir}: ${id}"
            for _ in $(seq 1 180); do
              status="$(gcloud builds describe "$id" --project="$PROJECT" --format='value(status)')"
              case "$status" in
                SUCCESS) echo "Build de ${dir} concluído."; return 0 ;;
                FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED)
                  echo "::error::Build de ${dir} terminou como ${status}."
                  gcloud builds describe "$id" --project="$PROJECT" --format='value(failureInfo.detail,statusDetail)' || true
                  echo "Logs: https://console.cloud.google.com/cloud-build/builds/${id}?project=${PROJECT}"
                  return 1 ;;
              esac
              sleep 10
            done
            echo "::error::Build de ${dir} não terminou em 30 minutos."; return 1
          }
          # As imagens são construídas a partir de api/ e worker/: a pasta única formatos/ vai junto.
          rm -rf api/formatos worker/formatos
          cp -r formatos api/formatos
          cp -r formatos worker/formatos
          build api "$API_IMAGE"
          build worker "$WORKER_IMAGE"

      - name: Atualizar motor e API sem apagar configuração
        shell: bash
        env:
          PROJECT: paperorchestra-mestrado
          REGION: southamerica-east1
        run: |
          set -euo pipefail
          API_IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/paper-orchestra/api:agents-${GITHUB_SHA}"
          WORKER_IMAGE="${REGION}-docker.pkg.dev/${PROJECT}/paper-orchestra/worker:agents-${GITHUB_SHA}"
          # Update de imagem somente: preservar variáveis de ambiente, serviços, IAM e Storage.
          # SHA do release também no worker: vai para o manifesto de proveniência (M14).
          # Flags do plano V2 registradas aqui para ficarem versionadas e rastreáveis.
          # Antes de mudar, mostra os valores atuais (só variáveis SCRIPTORIUM_*, sem segredos).
          echo "Flags V2 antes do deploy:"
          gcloud run jobs describe paper-orchestra-worker --region="$REGION" --project="$PROJECT" --format=json \
            | python3 -c "import json,sys; c=json.load(sys.stdin)['spec']['template']['spec']['template']['spec']['containers'][0]; [print(' ', e['name'], '=', e.get('value','(segredo)')) for e in c.get('env',[]) if e['name'].startswith('SCRIPTORIUM_V2')] or print('  (nenhuma; padrões do código)')" || true
          # Onda 1 ligada em 24/11/2026 por decisão do responsável: contexto por trechos
          # relevantes (mesmo orçamento de 75 mil caracteres). Desligar: trocar para false.
          # M17 (divergências entre fontes) e M22 (verificação iterativa) ligados na mesma
          # data, também por decisão do responsável: custo extra na chave de quem gera,
          # com tetos fixos (12 pares e 40 chamadas por pesquisa).
          V2_FLAGS="SCRIPTORIUM_V2_RETRIEVAL=true,SCRIPTORIUM_V2_CONTRADICTIONS=true,SCRIPTORIUM_V2_FIRE=true"
          gcloud run jobs update paper-orchestra-worker --image="$WORKER_IMAGE" --update-env-vars="SCRIPTORIUM_RELEASE_SHA=${GITHUB_SHA},${V2_FLAGS}" --region="$REGION" --project="$PROJECT" --quiet
          gcloud run services update paper-orchestra-api --image="$API_IMAGE" --update-env-vars="NEON_REVIEW_ENABLED=true,BYOK_ENABLED=true,SCRIPTORIUM_RELEASE_SHA=${GITHUB_SHA}" --region="$REGION" --project="$PROJECT" --quiet

      - name: Verificar publicação, revisão e proteção das rotas de contas
        shell: bash
        run: |
          set -euo pipefail
          # O health sozinho aceitava uma API antiga. Agora exigimos o SHA e
          # respostas 401 de cinco rotas de pesquisa/acesso sem token.
          python3 scripts/check-public-onboarding.py --expected-release "${GITHUB_SHA}" --attempts 12
          echo "API publicada e rotas protegidas. Validação autenticada ainda precisa de contas reais."
