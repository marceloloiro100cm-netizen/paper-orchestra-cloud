name: Relatar um problema
description: Algo no site, na biblioteca, no fluxo com a IA ou no PDF não funcionou como esperado.
title: "[Problema] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por relatar! **Não cole** textos da sua pesquisa, e-mails, tokens ou chaves aqui: esta issue é pública.
  - type: dropdown
    id: area
    attributes:
      label: Onde aconteceu?
      options:
        - Login e conta
        - Guia de escrita
        - Biblioteca (envio, fichamento, importação)
        - Fluxo com a IA (MCP)
        - Referências e normas (ABNT, APA)
        - PDF ou Word
        - Link de orientação
        - Outro
    validations:
      required: true
  - type: textarea
    id: o-que
    attributes:
      label: O que aconteceu?
      description: Descreva o que você fez, o que esperava e o que viu. Prints ajudam (sem dados pessoais).
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Abri ...
        2. Cliquei em ...
        3. Apareceu ...
  - type: input
    id: ambiente
    attributes:
      label: Aparelho e navegador
      placeholder: "Ex.: Android, Chrome 131 / Windows 11, Edge"
