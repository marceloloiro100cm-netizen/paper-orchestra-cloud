# M15: varredura completa semanal e a cada push em main.
# Origem: R28/R40 em docs/upstreams.json. Exemplo oficial conferido em 24/11/2026:
# https://google.github.io/osv-scanner/github-action
name: Segurança · OSV-Scanner semanal

on:
  schedule:
    - cron: "30 12 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  security-events: write
  contents: read

jobs:
  scan-scheduled:
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1"
