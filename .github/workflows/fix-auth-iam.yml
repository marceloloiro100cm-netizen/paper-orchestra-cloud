name: Corrigir permissão de login Firebase

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-auth-iam.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  corrigir-permissao-api:
    name: Permitir consulta de sessão pelo servidor
    if: github.repository == 'marceloloiro100cm-netizen/paper-orchestra-cloud' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Autenticar Google Cloud sem chaves privadas
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/201655574048/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: paper-orchestra-deployer@paperorchestra-mestrado.iam.gserviceaccount.com
          project_id: paperorchestra-mestrado
          create_credentials_file: true
          export_environment_variables: true

      - name: Preparar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: paperorchestra-mestrado

      - name: Conceder leitura do Firebase Auth apenas à API
        shell: bash
        env:
          PROJECT_ID: paperorchestra-mestrado
          API_SA: paper-orchestra-api@paperorchestra-mestrado.iam.gserviceaccount.com
        run: |
          set -euo pipefail
          gcloud iam service-accounts describe "$API_SA" --project="$PROJECT_ID" --format="value(email)" >/dev/null
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:$API_SA" \
            --role="roles/firebaseauth.viewer" --quiet >/dev/null
          gcloud projects get-iam-policy "$PROJECT_ID" --format=json > /tmp/project-iam.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/project-iam.json'))
          principal='serviceAccount:paper-orchestra-api@paperorchestra-mestrado.iam.gserviceaccount.com'
          grants=[b for b in data.get('bindings', []) if b.get('role')=='roles/firebaseauth.viewer']
          assert any(principal in b.get('members',[]) and not b.get('condition') for b in grants), 'Permissão de leitura do Auth não foi confirmada'
          print('Firebase Authentication Viewer concedido e verificado somente para a API.')
          PY
